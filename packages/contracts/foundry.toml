[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
build_info = true

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
opn_testnet = "https://testnet-rpc2.iopn.tech/"
iopn = "${IOPN_RPC_URL}"

[etherscan]
iopn = { key = "${IOPN_EXPLORER_API_KEY}", url = "${IOPN_EXPLORER_API_URL}" }
