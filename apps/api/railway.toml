[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "pnpm --filter @iopn/database exec prisma db push --schema=./prisma/schema.prisma --accept-data-loss && pnpm --filter @iopn/api start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
